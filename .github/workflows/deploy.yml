name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # Asset path prefix. Must match the repo name with a leading and
          # trailing slash, OR set to "/" for a custom domain.
          VITE_BASE: /fitness-pacific/

          # Backend API URL — set as a repo VARIABLE (not secret) at:
          # Settings -> Secrets and variables -> Actions -> Variables -> New variable
          # Variable name:  VITE_API_URL
          # Value:          https://your-railway-app.up.railway.app
          # If left unset, the app runs in stub mode (mock food data, no backend).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
